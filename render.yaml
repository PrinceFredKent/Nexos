services:
  - type: web
    name: nexos-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements-render.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # ── Database ────────────────────────────────────────────────────────────
      - key: DATABASE_URL
        sync: false   # Set in Render dashboard → Environment
      # ── Auth ────────────────────────────────────────────────────────────────
      - key: JWT_SECRET_KEY
        sync: false   # Generate a strong random secret; e.g. openssl rand -hex 32
      # ── CORS & Frontend ─────────────────────────────────────────────────────
      - key: ALLOWED_ORIGINS
        sync: false   # e.g. https://nexos.pages.dev,https://your-custom-domain.com
      - key: FRONTEND_URL
        sync: false   # e.g. https://nexos.pages.dev
      # ── Email / SMTP ────────────────────────────────────────────────────────
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false   # Use a Gmail App Password, not your account password
      - key: SMTP_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: BREVO_API_KEY
        sync: false
      # ── SMS via Termii ──────────────────────────────────────────────────────
      - key: TERMII_API_KEY
        sync: false   # Get from https://accounts.termii.com/#/
      - key: TERMII_SENDER_ID
        value: "NEXOS"  # Max 11 chars branded sender name
      # ── Google OAuth ────────────────────────────────────────────────────────
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # ── Sync ────────────────────────────────────────────────────────────────
      - key: SYNC_INTERVAL_MINUTES
        value: "5"
