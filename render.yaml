services:
  - type: web
    name: nexos-health
    env: docker
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # ── Database (Supabase PostgreSQL) ──────────────────────────────────────
      - key: DATABASE_URL
        sync: false   # Set in Render dashboard → Environment
      # ── Auth ────────────────────────────────────────────────────────────────
      - key: JWT_SECRET_KEY
        sync: false   # Generate with: openssl rand -hex 32
      # ── CORS ────────────────────────────────────────────────────────────────
      - key: ALLOWED_ORIGINS
        value: "*"
      # ── Email / SMTP (for OTP Verification) ─────────────────────────────────
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false   # Gmail App Password (16 characters)
      - key: SMTP_FROM
        sync: false
      # ── Background Sync ─────────────────────────────────────────────────────
      - key: SYNC_INTERVAL_MINUTES
        value: "5"
