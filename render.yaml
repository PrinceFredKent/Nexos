services:
  - type: web
    name: nexos-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements-render.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false          # Set this manually in Render dashboard
      - key: JWT_SECRET_KEY
        sync: false          # Set this manually in Render dashboard
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      # ── Resend HTTP API (replaces SMTP on Render free tier) ──
      - key: RESEND_API_KEY
        sync: false          # Set in Render dashboard: https://resend.com/api-keys
      - key: RESEND_FROM
        value: "onboarding@resend.dev"  # Change to your verified domain once set up
      - key: USE_CLOUD_DB
        value: "true"        # Use the cloud database as the primary production datastore
      - key: SYNC_INTERVAL_MINUTES
        value: "10"
      - key: FRONTEND_URL
        sync: false          # Your Vercel URL e.g. https://nexos.vercel.app
